<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingold — Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="dc-lite.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#12100D}
a{color:#D9B45A}a:hover{color:#EBCB7A}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="background: #12100D; color: #F2ECDF; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5">

<header style="border-bottom: 1px solid #2E2922">
<div style="max-width: 1200px; margin: 0 auto; padding: 18px clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
<a href="index.html" aria-label="Wingold home" style="display: flex; align-items: center; gap: 12px; color: #F2ECDF; text-decoration: none">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; box-sizing: border-box; border: 1.5px solid #D9B45A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600; color: #D9B45A">Au</span>
<span style="font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 20px; font-weight: 800; letter-spacing: 0.08em">WINGOLD</span>
</a>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #C9C0AE">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="5" y="11" width="14" height="10" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
Secure checkout
</p>
</div>
</header>

<main>
<div style="max-width: 1200px; margin: 0 auto; padding: 24px clamp(20px, 5vw, 64px) 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="competition.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #C9C0AE; text-decoration: none; font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>
Change tickets
</a>
<ol aria-label="Entry steps" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">
<li style="padding: 8px 12px; border: 1px solid #3A332A; color: #C9C0AE">1 Tickets</li>
<li style="padding: 8px 12px; border: 1px solid #3A332A; color: #C9C0AE">2 Question</li>
<li aria-current="step" style="padding: 8px 12px; background: #D9B45A; color: #12100D; font-weight: 600">3 Payment</li>
</ol>
</div>

<div style="max-width: 1200px; margin: 0 auto; padding: 32px clamp(20px, 5vw, 64px) 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 56px; align-items: start">

<section aria-labelledby="pay-heading" style="display: flex; flex-direction: column; gap: 24px">
<h1 id="pay-heading" style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: clamp(32px, 4vw, 48px); font-weight: 800; line-height: 1; text-transform: uppercase">Payment</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 8px">
<button type="button" style="min-height: 52px; padding: 0 16px; border: 1px solid #F2ECDF; background: #F2ECDF; color: #12100D; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700">Apple Pay</button>
<button type="button" style="min-height: 52px; padding: 0 16px; border: 1px solid #F2ECDF; background: #F2ECDF; color: #12100D; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700">Google Pay</button>
<button type="button" style="min-height: 52px; padding: 0 16px; border: 1px solid #F2ECDF; background: #F2ECDF; color: #12100D; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700">PayPal</button>
</div>

<div style="display: flex; align-items: center; gap: 16px; color: #A89F8E; font-size: 14px">
<span style="flex: 1; height: 1px; background: #2E2922"></span>
<span>or pay by card</span>
<span style="flex: 1; height: 1px; background: #2E2922"></span>
</div>

<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 28px; border: 1px dashed #3A332A">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #D9B45A">Card form</p>
<p style="margin: 0; font-size: 17px; font-weight: 600">Secure card fields from [PAYMENT PROVIDER]</p>
<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">Card number, expiry and security code are entered in your payment provider's secure form, shown here once your merchant account is live. Wingold never sees or stores card details.</p>
</div>

<div style="display: flex; gap: 12px; padding: 16px 20px; background: #1A1713; border: 1px solid #2E2922">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="flex: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18"></path></svg>
<p style="margin: 0; font-size: 14px; color: #C9C0AE; text-wrap: pretty">Credit card payments are limited to £250 per calendar month across all Wingold competitions. Debit cards, Apple Pay and Google Pay linked to a debit card are not affected.</p>
</div>

<label for="accept-terms" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; border: 1px solid {{acceptBd}}; cursor: pointer; font-size: 16px">
<input type="checkbox" id="accept-terms" checked="{{accepted}}" onChange="{{toggleAccept}}" style="width: 20px; height: 20px; margin: 0; flex: none; accent-color: #D9B45A">
<span>I have read and accept the <a href="terms.html" style="color: #D9B45A">terms and conditions</a>, including the refund rule if the competition doesn't sell out.</span>
</label>

<button type="button" disabled="{{locked}}" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; border: 0; background: {{payBg}}; color: {{payFg}}; font-family: 'Inter', system-ui, sans-serif; font-size: 17px; font-weight: 700">Pay {{totalLabel}}</button>

<p style="margin: 0; font-size: 13px; color: #A89F8E; text-wrap: pretty">Your statement will show WINGOLD. Payments are processed by [PAYMENT PROVIDER]. Prefer not to pay? You can enter for free by post, see the <a href="terms.html" style="color: #D9B45A">terms</a>.</p>
</section>

<aside aria-labelledby="order-heading" style="display: flex; flex-direction: column; gap: 20px; padding: 28px; background: #1A1713; border: 1px solid #3A332A">
<h2 id="order-heading" style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B45A">Your order</h2>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 28px; font-weight: 800; line-height: 1.1; text-transform: uppercase">{{c.name}}</p>
<p style="margin: 0; color: #C9C0AE">{{c.gramsLabel}} of fine gold 999.9</p>
</div>
<svg aria-hidden="true" width="88" height="56" viewBox="0 0 88 56" style="flex: none">
<polygon points="16,26 72,26 82,48 6,48" fill="#A87A2C"></polygon>
<polygon points="24,8 64,8 72,26 16,26" fill="#E2C275"></polygon>
<polyline points="16,26 72,26" fill="none" stroke="#F6E3A1" style="stroke-width: 1"></polyline>
</svg>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 0; border-top: 1px solid #2E2922; border-bottom: 1px solid #2E2922">
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>{{qtyLabel}} × {{c.priceLabel}}</span><span style="color: #F2ECDF; font-weight: 600">{{fullLabel}}</span></div>
<sc-if value="{{hasDiscount}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>Pack discount ({{offLabel}})</span><span style="color: #D9B45A; font-weight: 600">−{{saveLabel}}</span></div>
</sc-if>
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>Your odds</span><span style="color: #F2ECDF; font-weight: 600">{{oddsLabel}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-weight: 600">Total</span>
<span style="font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 32px; font-weight: 800">{{totalLabel}}</span>
</div></div>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #C9C0AE">
<li style="display: flex; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="flex: none; margin-top: 2px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg><span>Your answer applies to every ticket in this order.</span></li>
<li style="display: flex; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="flex: none; margin-top: 2px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg><span>Not sold out by {{closeLabel}}? Every ticket is refunded in full.</span></li>
<li style="display: flex; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="flex: none; margin-top: 2px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg><span>Your ticket numbers are emailed as soon as payment is confirmed.</span></li>
</ul>
</aside>
</div>
</main>

<footer style="border-top: 1px solid #2E2922; background: #0D0B09">
<div style="max-width: 1200px; margin: 0 auto; padding: 32px clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-size: 13px; color: #A89F8E">
<p style="margin: 0">18+ only · Play responsibly: set a monthly spending limit in your account.</p>
<nav aria-label="Legal" style="display: flex; flex-wrap: wrap; gap: 8px 20px">
<a href="terms.html" style="color: #C9C0AE">Terms and conditions</a>
<a href="#privacy" style="color: #C9C0AE">Privacy</a>
<a href="#contact" style="color: #C9C0AE">Contact</a>
</nav>
</div>
</footer>

</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"competition":{"editor":"enum","options":["kilo","bigbar","classic","ounce","rush"],"default":"kilo","section":"Preview"},"qty":{"editor":"int","default":15,"min":1,"max":50,"section":"Preview"},"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  componentDidMount() {
    var t = Date.now();
    this.setState({ start: t, accepted: false });
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var start = st.start || Date.now();
    var accepted = !!st.accepted;
    var which = this.props.competition ?? 'kilo';
    var qty = Math.max(1, Math.min(50, Number(this.props.qty ?? 15)));
    function money(n) {
      var r = Math.round(n * 100) / 100;
      var whole = Math.abs(r - Math.round(r)) < 0.005;
      return '£' + r.toLocaleString('en-GB', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
    }
    function num(n) { return Math.round(n).toLocaleString('en-GB'); }
    var all = {
      kilo: { name: 'Jackpot Kilo', gramsLabel: '1,000 g', price: 96, max: 2000, hours: 26 * 24 + 5 },
      bigbar: { name: 'Big Bar', gramsLabel: '250 g', price: 60, max: 800, hours: 18 * 24 + 9 },
      classic: { name: 'Classic', gramsLabel: '100 g', price: 48, max: 400, hours: 12 * 24 + 3 },
      ounce: { name: 'The Ounce', gramsLabel: '31.10 g', price: 24, max: 250, hours: 5 * 24 + 14 },
      rush: { name: 'Gold Rush 24h', gramsLabel: '10 g', price: 12, max: 170, hours: 23.5 }
    };
    var c = all[which] || all.kilo;
    var off = qty >= 50 ? 12 : qty >= 25 ? 10 : qty >= 20 ? 8 : qty >= 15 ? 5 : 0;
    var full = c.price * qty;
    var total = Math.round(full * (100 - off)) / 100;
    var vat = Math.round(total / 6 * 100) / 100;
    var closes = start + c.hours * 3600000;
    return {
      c: { name: c.name, gramsLabel: c.gramsLabel, priceLabel: money(c.price) },
      qtyLabel: qty === 1 ? '1 ticket' : qty + ' tickets',
      fullLabel: money(full),
      hasDiscount: off > 0,
      offLabel: off + '% off',
      saveLabel: money(full - total),
      totalLabel: money(total),
      vatLabel: money(vat),
      oddsLabel: '1 in ' + num(c.max / qty),
      closeLabel: new Date(closes).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
      accepted: accepted,
      acceptBd: accepted ? '#D9B45A' : '#3A332A',
      toggleAccept: function () { self.setState({ accepted: !accepted }); },
      locked: !accepted,
      payBg: accepted ? '#D9B45A' : '#2A251E',
      payFg: accepted ? '#12100D' : '#A89F8E'
    };
  }
}
</script>
</body>
</html>
