<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 32px">
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #D9B45A">
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; color: #D9B45A">01</span>
<h3 style="margin: 0; font-size: 22px; font-weight: 700">Choose your bar</h3>
<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">Five weights, from 10 g to a full kilo. Take 1 to 10 tickets, or a pack of 15 to 50 for up to 12% off.</p>
</li>
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #D9B45A">
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; color: #D9B45A">02</span>
<h3 style="margin: 0; font-size: 22px; font-weight: 700">Answer the question</h3>
<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">Every entry comes with a short question about gold. Only correct answers go into the draw.</p>
</li>
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #D9B45A">
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; color: #D9B45A">03</span>

<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">When the last ticket goes, a certified random number generator picks the winner. Not sold out by the closing date? The competition is cancelled and every ticket is refunded.</p>
</li>

<section id="rules" style="max-width: 1200px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 64px); display: flex; flex-direction: column; gap: 40px">
<h2 style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: clamp(30px, 3.6vw, 44px); font-weight: 800; line-height: 1.05; text-transform: uppercase; text-wrap: balance">Four rules we never bend</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 1px; background: #2E2922; border: 1px solid #2E2922">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #12100D">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
<h3 style="margin: 0; font-size: 19px; font-weight: 700">Sell-out or full refund</h3>
<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">No sell-out, no draw. If a competition isn't sold out by its closing date, every ticket is refunded to the card it was paid with.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #12100D">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D9B45A" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M9 6v12"></path></svg>
<h3 style="margin: 0; font-size: 19px; font-weight: 700">Fixed ticket caps</h3>
<p style="margin: 0; color: #C9C0AE; text-wrap: pretty">The number of tickets is set at launch and never raised. Your odds are exactly what the page says.</p>

<script type="text/x-dc" data-dc-script data-props='{"spot":{"editor":"float","default":94.01,"min":20,"max":300,"step":0.01,"unit":"£/g","section":"Pricing"},"salesPreview":{"editor":"range","default":0,"min":0,"max":100,"step":1,"unit":"%","section":"Preview"},"ageGate":{"editor":"boolean","default":true,"section":"Preview"},"$preview":{"width":1440,"height":4100}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    var t = Date.now();
    var passed = false;
    try { passed = window.sessionStorage.getItem('wingold-age-ok') === 'yes'; } catch (e) { passed = false; }
    this.setState({ start: t, now: t, passed: passed, age: false, refused: false });
    this._timer = setInterval(function () { self.setState({ now: Date.now() }); }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
  }
  renderVals() {
    var st = this.state || {};
    var now = st.now || Date.now();
    var start = st.start || now;
    var spot = Number(this.props.spot ?? 94.01);
    var preview = Number(this.props.salesPreview ?? 0);
    function money(n) {
      var r = Math.round(n * 100) / 100;
      var whole = Math.abs(r - Math.round(r)) < 0.005;
      return '£' + r.toLocaleString('en-GB', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
    }
    function num(n) { return Math.round(n).toLocaleString('en-GB'); }
    function roundValue(v) { return v < 5000 ? Math.round(v / 10) * 10 : Math.round(v / 100) * 100; }
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function countdown(ms) {
      var s = Math.max(0, Math.floor(ms / 1000));
      return { d: pad(Math.floor(s / 86400)), h: pad(Math.floor((s % 86400) / 3600)), m: pad(Math.floor((s % 3600) / 60)), s: pad(s % 60) };
    }
    var base = [
      { id: 'kilo', name: 'Jackpot Kilo', weight: '1 kg', grams: 1000, price: 96, max: 2000, hours: 26 * 24 + 5 },
      { id: 'bigbar', name: 'Big Bar', weight: '250 g', grams: 250, price: 60, max: 800, hours: 18 * 24 + 9 },
      { id: 'classic', name: 'Classic', weight: '100 g', grams: 100, price: 48, max: 400, hours: 12 * 24 + 3 },
      { id: 'ounce', name: 'The Ounce', weight: '1 oz', grams: 31.1035, price: 24, max: 250, hours: 5 * 24 + 14 },
      { id: 'rush', name: 'Gold Rush 24h', weight: '10 g', grams: 10, price: 12, max: 170, hours: 23.5 }
    ];
    var comps = base.map(function (c) {
      var closes = start + c.hours * 3600000;
      var sold = Math.round(c.max * preview / 100);
      var pct = Math.round(sold / c.max * 100);
      return {
        id: c.id,
        name: c.name,
        weight: c.weight,
        value: money(roundValue(c.grams * spot)),
        priceLabel: money(c.price),
        maxLabel: num(c.max),
        soldLabel: num(sold) + ' of ' + num(c.max),
        pct: pct,
        pctLabel: pct + '%',
        cd: countdown(closes - now),
        low: c.max <= 400,
        endingSoon: closes > now && closes - now < 48 * 3600000,
        showBadges: c.max <= 400 || (closes > now && closes - now < 48 * 3600000)
      };
    });
    var self = this;
    var age = !!st.age;
    var refused = !!st.refused;
    var ready = age;
    var gate = {
      show: (this.props.ageGate ?? true) && !st.passed,
      asking: !refused,
      refused: refused,
      age: age,
      ageBd: age ? '#D9B45A' : '#3A332A',
      locked: !ready,
      btnBg: ready ? '#D9B45A' : '#2A251E',
      btnFg: ready ? '#12100D' : '#A89F8E',
      toggleAge: function () { self.setState({ age: !age }); },
      refuse: function () { self.setState({ refused: true }); },
      back: function () { self.setState({ refused: false }); },
      enter: function () {
        if (!ready) { return; }
        try { window.sessionStorage.setItem('wingold-age-ok', 'yes'); } catch (e) { /* storage unavailable: the gate simply shows again next time */ }
        self.setState({ passed: true });
      }
    };
    return { comps: comps, hero: comps[0], spotLabel: spot.toFixed(2), gate: gate };
  }
}
</script>
