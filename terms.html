<p style="margin: 0; font-size: 17px; color: #C9C0AE">Last updated 18 November 2026. These terms apply to every Wingold competition.</p>
<p style="margin: 0; align-self: flex-start; padding: 8px 12px; border: 1px dashed #D9B45A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #D9B45A">Draft · to be reviewed by a UK solicitor before launch</p>

<h2 id="short-version" style="margin: 0; font-size: 20px; font-weight: 700">The short version</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #E6DFD1; line-height: 1.6">

<section id="t1" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">1. About us</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">1.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Wingold competitions are run by Wingold Ltd ("Wingold", "we", "us"), registered in England and Wales under company number [COMPANY NO.], with its registered office at [REGISTERED OFFICE ADDRESS].</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">1.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">You can contact us at [CONTACT EMAIL].</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">1.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">By entering a competition, you accept these terms and the details shown on that competition's page. If the two ever conflict, these terms apply.</p></div>
</section>

<section id="t2" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">2. Who can enter</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">2.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Competitions are open to residents of the United Kingdom aged 18 or over.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">2.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Our employees, their immediate families and anyone professionally connected with a competition cannot enter it.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">2.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We may check your age, identity and address at any time, and always before releasing a prize. Entries from anyone who does not meet these conditions are void and refunded.</p></div>
</section>

<section id="t3" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">3. How to enter online</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Choose a competition and a number of tickets, answer the entry question and pay.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">One answer applies to every ticket in the same order. Only entries with the correct answer go into the draw. Entries with an incorrect answer are not refunded.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">You can buy up to 50 tickets per competition. Packs of 15, 20, 25 and 50 tickets are discounted as shown on the competition page.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.4</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Your entry is confirmed once we have received your payment. We email you your ticket numbers.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.5</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">An entry is void if its payment is reversed or charged back.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">3.6</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Payments by credit card are limited to £250 per calendar month in total across all our competitions.</p></div>
</section>

<section id="t4" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">4. Free entry by post</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">4.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">You can enter any competition free of charge by post. Send an unenclosed postcard, by first- or second-class post, to [POSTAL ENTRY ADDRESS] with your full name, address, date of birth, phone number, email address, the name of the competition and your answer to its entry question.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">4.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">One entry per postcard, and no more than 50 postal entries per person per competition.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">4.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Postcards must arrive before the competition closes. Postal entries are treated exactly like paid entries: they take up tickets within the ticket cap and have the same chance of winning.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">4.4</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">If a competition is cancelled, postal entries to it are void.</p></div>
</section>

<section id="t5" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">5. Tickets and odds</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">5.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Each competition has a maximum number of tickets, shown on its page. We set it at launch and never increase it.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">5.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Because the draw only takes place once every ticket has been sold, the odds per ticket are exactly 1 in the maximum number of tickets.</p></div>
</section>

<section id="t6" style="display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #1A1713; border: 1px solid #D9B45A">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B45A">Important</p>
<h2 style="margin: 0; font-size: 24px; font-weight: 700">6. Sell-out, cancellation and refunds</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">A competition closes as soon as every ticket has been sold, or at the closing date and time shown on its page, whichever comes first.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">If every ticket has been sold, the draw takes place within 7 days of the competition closing.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">If not every ticket has been sold by the closing date, the competition is cancelled and no draw takes place. We never extend a closing date to sell the remaining tickets.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.4</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">When a competition is cancelled, we refund every paid entry in full, meaning the amount you actually paid, pack discounts included, to the payment method you used, within 14 days of the closing date. You do not need to do anything.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.5</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We email every entrant to say the competition has been cancelled and that their refund is on its way.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">6.6</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">If we ever have to cancel a competition for any other reason outside our control, we refund every paid entry in full in the same way.</p></div>
</section>

<section id="t7" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">7. The draw</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">7.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Each competition has one winner, chosen at random from all correct entries, paid and postal, using a certified independent random number generator.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">7.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We stream every draw live and publish the winning ticket number and the draw certificate on our Winners page.</p></div>
</section>

<section id="t8" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">8. The prize</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">8.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">The prize is the fine gold bar described on the competition page, with the weight shown and a fineness of 999.9.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">8.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">The value shown is indicative, based on the gold spot price on the date stated, and may change. The prize is the bar itself, not a sum of money, and there is no cash alternative.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">8.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Each bar comes from an LBMA-accredited refiner, with its serial number and assay certificate. If that bar cannot be supplied, we award a bar of the same weight and fineness from another accredited refiner.</p></div>
</section>

<section id="t9" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">9. Claiming and handover</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">9.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We contact the winner by email and phone within 48 hours of the draw.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">9.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">To claim the prize, the winner must reply within 14 days and send proof of age, identity and UK address, and proof that the payment card used was theirs.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">9.3</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We hand the bar over to the winner in person, at a time and place agreed with them, within 30 days of the draw once these details are verified. If an in-person handover is not possible, we deliver the bar free of charge, fully insured and signed-for, to the winner's address within the same period. Claiming a prize never costs anything.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">9.4</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">If, despite reasonable efforts, we cannot reach the winner within 28 days of the draw, or the winner does not meet these terms, we draw a new winner from the remaining correct entries in the same way.</p></div>
</section>

<section id="t10" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">10. Publicity</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">10.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">We publish the winner's first name and county on our website, or make them available on request, unless the winner objects.</p></div>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">10.2</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">With the winner's agreement, we film the handover of the bar and share it on our website and social media. Winners can refuse, or withdraw their agreement before publication, without affecting their prize.</p></div>
</section>

<section id="t11" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">11. Playing responsibly</h2>
<div style="display: flex; gap: 16px"><span style="flex: none; width: 40px; padding-top: 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: #D9B45A">11.1</span><p style="margin: 0; color: #E6DFD1; line-height: 1.65">Competitions are entertainment. Only spend what you can afford to lose.</p></div>
