<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingold — Enter a competition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="dc-lite.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#12100D}
a{color:#D9B45A}a:hover{color:#EBCB7A}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
summary{cursor:pointer}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="background: #12100D; color: #F2ECDF; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5">

<header style="border-bottom: 1px solid #2E2922">
<div style="max-width: 1200px; margin: 0 auto; padding: 18px clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
<a href="index.html" aria-label="Wingold home" style="display: flex; align-items: center; gap: 12px; color: #F2ECDF; text-decoration: none">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; box-sizing: border-box; border: 1.5px solid #D9B45A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600; color: #D9B45A">Au</span>
<span style="font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 20px; font-weight: 800; letter-spacing: 0.08em">WINGOLD</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-size: 15px">
<a href="index.html" style="color: #F2ECDF; text-decoration: none">Competitions</a>
<a href="index.html" style="color: #F2ECDF; text-decoration: none">How it works</a>
<a href="index.html" style="color: #F2ECDF; text-decoration: none">Our rules</a>
<a href="index.html" style="color: #F2ECDF; text-decoration: none">Winners</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px">
<a href="#account" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; box-sizing: border-box; border: 1px solid #3A332A; color: #F2ECDF; text-decoration: none; font-size: 15px">Sign in</a>
<a href="#basket" aria-label="Basket" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #3A332A; color: #F2ECDF">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
</a>
</div>
</div>
</header>

<main>
<div style="max-width: 1200px; margin: 0 auto; padding: 24px clamp(20px, 5vw, 64px) 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #C9C0AE; text-decoration: none; font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>
All competitions
</a>
<ol aria-label="Entry steps" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">
<li aria-current="step" style="padding: 8px 12px; background: #D9B45A; color: #12100D; font-weight: 600">1 Tickets</li>
<li style="padding: 8px 12px; border: 1px solid #3A332A; color: #C9C0AE">2 Question</li>
<li style="padding: 8px 12px; border: 1px solid #3A332A; color: #C9C0AE">3 Payment</li>
</ol>
</div>

<div style="max-width: 1200px; margin: 0 auto; padding: 32px clamp(20px, 5vw, 64px) 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 56px; align-items: start">

<div style="display: flex; flex-direction: column; gap: 32px">
<div style="border: 1px solid #2E2922; background: #17140F">
<svg role="img" aria-label="Illustration of the fine gold bar to win" viewBox="0 0 480 300" style="display: block; width: 100%; height: auto">
<defs>
<radialGradient id="cGlow" cx="50%" cy="58%" r="55%"><stop offset="0" style="stop-color: #D9B45A; stop-opacity: 0.22"></stop><stop offset="1" style="stop-color: #D9B45A; stop-opacity: 0"></stop></radialGradient>
<linearGradient id="cTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: #F6E3A1"></stop><stop offset="1" style="stop-color: #D8AE4E"></stop></linearGradient>
<linearGradient id="cFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: #C9973B"></stop><stop offset="1" style="stop-color: #8A5F1E"></stop></linearGradient>
<linearGradient id="cSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: #FFFFFF; stop-opacity: 0"></stop><stop offset="0.42" style="stop-color: #FFFFFF; stop-opacity: 0.32"></stop><stop offset="0.56" style="stop-color: #FFFFFF; stop-opacity: 0"></stop></linearGradient>
</defs>
<rect x="0" y="0" width="480" height="300" fill="url(#cGlow)"></rect>
<ellipse cx="240" cy="262" rx="210" ry="14" fill="#000000" style="opacity: 0.55"></ellipse>
<polygon points="84,156 396,156 436,248 44,248" fill="url(#cFront)"></polygon>
<polygon points="124,62 356,62 396,156 84,156" fill="url(#cTop)"></polygon>
<polygon points="124,62 356,62 396,156 84,156" fill="url(#cSheen)"></polygon>
<polyline points="84,156 396,156" fill="none" stroke="#FBEAB0" style="stroke-width: 1.5"></polyline>
<rect x="160" y="78" width="160" height="66" fill="none" stroke="#9C7128" style="stroke-width: 1.5"></rect>
<text x="240" y="96" fill="#7A5418" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 3px; text-anchor: middle">WINGOLD</text>
<text x="240" y="124" fill="#6B4812" style="font-family: 'Archivo', 'Arial Black', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 26px; text-anchor: middle">{{c.stamp}}</text>
<text x="240" y="139" fill="#7A5418" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 2px; text-anchor: middle">FINE GOLD 999.9</text>
</svg>
</div>
<section aria-labelledby="bar-heading" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="bar-heading" style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 22px; font-weight: 800; text-transform: uppercase">The bar</h2>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 1px; background: #2E2922; border: 1px solid #2E2922">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Weight</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">{{c.gramsLabel}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Fineness</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">999.9 fine gold</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Refiner</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">[LBMA-ACCREDITED REFINER]</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Comes with</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">Serial number and assay certificate</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Prize value</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">{{c.value}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Handover</dt><dd style="margin: 0; font-size: 17px; font-weight: 600">In person</dd></div>
</dl>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B45A">Fine gold 999.9 · {{c.weight}}</p>
<h1 style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: clamp(36px, 4.4vw, 56px); font-weight: 800; line-height: 1; text-transform: uppercase; text-wrap: balance">{{c.name}}</h1>
<sc-if value="{{showBadges}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{low}}" hint-placeholder-val="{{false}}"><span style="padding: 5px 10px; border: 1px solid #D9B45A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #D9B45A">Only {{c.maxLabel}} tickets</span></sc-if>
<sc-if value="{{endingSoon}}" hint-placeholder-val="{{false}}"><span style="padding: 5px 10px; border: 1px solid #D9B45A; background: #D9B45A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #12100D">Ending soon</span></sc-if>
</div>
</sc-if>
<p style="margin: 0; font-size: 18px; color: #C9C0AE; text-wrap: pretty">{{c.gramsLabel}} of fine gold, worth {{c.value}}.</p>
</div>

<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 1px; background: #2E2922; border: 1px solid #2E2922">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Ticket</dt><dd style="margin: 0; font-size: 20px; font-weight: 600">{{c.priceLabel}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Max tickets</dt><dd style="margin: 0; font-size: 20px; font-weight: 600">{{c.maxLabel}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; background: #12100D"><dt style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Odds per ticket</dt><dd style="margin: 0; font-size: 20px; font-weight: 600">1 in {{c.maxLabel}}</dd></div>
</dl>

<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Closes in</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; background: #1A1713; border: 1px solid #2E2922"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; line-height: 1.2">{{cd.d}}</span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Days</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; background: #1A1713; border: 1px solid #2E2922"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; line-height: 1.2">{{cd.h}}</span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Hrs</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; background: #1A1713; border: 1px solid #2E2922"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; line-height: 1.2">{{cd.m}}</span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Min</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; background: #1A1713; border: 1px solid #2E2922"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; line-height: 1.2">{{cd.s}}</span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A89F8E">Sec</span></div>
</div>
<p style="margin: 0; font-size: 14px; color: #C9C0AE; text-wrap: pretty">Closes at sell-out or on {{closeLabel}}, whichever comes first. Not sold out by then? Every ticket is refunded.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #C9C0AE"><span>{{soldLabel}} sold</span><span>{{pctLabel}}</span></div>
<div style="height: 6px; background: #2A251E"><div style="height: 6px; width: {{pct}}%; background: #D9B45A"></div></div>
</div>
</div>

<section aria-labelledby="qty-heading" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="qty-heading" style="margin: 0; font-size: 20px; font-weight: 700">How many tickets?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="10">
<button type="button" aria-pressed="{{ch.pressed}}" onClick="{{ch.pick}}" style="min-height: 52px; padding: 0; border: 1px solid {{ch.bd}}; background: {{ch.bg}}; color: {{ch.fg}}; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 600">{{ch.n}}</button>
</sc-for>
</div>
<h3 style="margin: 8px 0 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B45A">Packs</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(110px, 100%), 1fr)); gap: 8px">
<sc-for list="{{packs}}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Inter', system-ui, sans-serif">
<span style="font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 26px; font-weight: 800; line-height: 1.1">{{p.n}}</span>
<span style="font-size: 14px; font-weight: 700">{{p.offLabel}}</span>
<span style="font-size: 13px">{{p.odds}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; border: 1px solid #3A332A">
<button type="button" aria-label="Remove one ticket" onClick="{{dec}}" disabled="{{atMin}}" style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; padding: 0; border: 0; background: transparent; color: #F2ECDF">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round"><path d="M5 12h14"></path></svg>
</button>
<span aria-live="polite" style="min-width: 120px; text-align: center; font-size: 16px; font-weight: 600">{{qtyLabel}}</span>
<button type="button" aria-label="Add one ticket" onClick="{{inc}}" disabled="{{atMax}}" style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; padding: 0; border: 0; background: transparent; color: #F2ECDF">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</button>
</div>
<p style="margin: 0; font-size: 13px; color: #A89F8E">Maximum 50 tickets per person.</p>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #1A1713; border: 1px solid #3A332A">
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>Tickets</span><span style="color: #F2ECDF; font-weight: 600">{{qtyLabel}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>Your odds</span><span style="color: #F2ECDF; font-weight: 600">{{oddsLabel}}</span></div>
<sc-if value="{{hasDiscount}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: space-between; gap: 12px; color: #C9C0AE"><span>Pack discount ({{offLabel}})</span><span style="color: #D9B45A; font-weight: 600">−{{saveLabel}}</span></div>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 12px; border-top: 1px solid #2E2922">
<span style="font-weight: 600">Total</span>
<span style="display: flex; align-items: baseline; gap: 10px">
<sc-if value="{{hasDiscount}}" hint-placeholder-val="{{false}}">
<s style="font-size: 15px; color: #A89F8E">{{fullLabel}}</s>
</sc-if>
<span style="font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: 30px; font-weight: 800">{{totalLabel}}</span>
</span>
</div>
</div>

<fieldset style="margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #3A332A">
<legend style="padding: 0 8px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B45A">Entry question</legend>
<p style="margin: 0; font-size: 19px; font-weight: 700">How many grams are in one troy ounce?</p>
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<label for="{{o.id}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; border: 1px solid {{o.bd}}; cursor: pointer; font-size: 17px">
<input type="radio" id="{{o.id}}" name="entry-question" checked="{{o.checked}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #D9B45A">
<span>{{o.label}}</span>
</label>
</sc-for>
<p style="margin: 0; font-size: 14px; color: #A89F8E">Only correct answers go into the draw.</p>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
<a href="checkout.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; background: #D9B45A; color: #12100D; text-decoration: none; font-size: 17px; font-weight: 700">Continue to payment · {{totalLabel}}</a>
</sc-if>
<sc-if value="{{notAnswered}}" hint-placeholder-val="{{true}}">
<button type="button" disabled="disabled" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; border: 0; background: #2A251E; color: #A89F8E; font-family: 'Inter', system-ui, sans-serif; font-size: 17px; font-weight: 700">Answer the question to continue</button>
</sc-if>
<p style="margin: 0; font-size: 14px; color: #A89F8E; text-wrap: pretty">Prefer not to pay? You can enter for free by post. See the <a href="terms.html" style="color: #D9B45A">terms and conditions</a>.</p>
</div>
</div>
</div>

<section style="border-top: 1px solid #2E2922; border-bottom: 1px solid #2E2922; background: #17140F">
<div style="max-width: 1200px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) clamp(20px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 24px 56px; align-items: center">
<h2 style="margin: 0; font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-size: clamp(30px, 3.6vw, 44px); font-weight: 800; line-height: 1.05; text-transform: uppercase; text-wrap: balance">No sell-out, no draw.</h2>
<p style="margin: 0; font-size: 18px; color: #C9C0AE; text-wrap: pretty">If the {{c.name}} isn't sold out by {{closeLabel}}, the competition is cancelled and every ticket is refunded in full to the card it was paid with. You don't need to do anything. <a href="terms.html" style="color: #D9B45A">Read section 6 of our terms</a>.</p>
</div>
</section>

<section id="faq" style="max-width: 1200px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 64px); display: flex; flex-direction: column; gap: 32px">
